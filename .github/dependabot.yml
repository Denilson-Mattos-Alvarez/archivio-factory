version: 2

# Solo proposte di aggiornamento: revisione e collaudo prima dell'applicazione.
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    commit-message:
      prefix: dipendenze

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    commit-message:
      prefix: collaudo
